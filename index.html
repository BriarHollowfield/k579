<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram-канал — приєднатися</title>
  <meta name="description" content="Кнопка переходу в наш Telegram-канал">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --tone-a: #0e1626;
      --tone-b: #1d2940;
      --ink: #e3eaf4;
      --ink-dim: #6e8098;
      --accent: #9fb0c4;
      --accent-strong: #e3eaf4;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --tone-a: #fafbfd;
        --tone-b: #e6eaf0;
        --ink: #22334c;
        --ink-dim: #6e8098;
        --accent: #64788f;
        --accent-strong: #16233a;
      }
    }

    html { height: 100%; background: var(--tone-b); }
    body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--tone-a) 0%, var(--tone-b) 100%);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      width: 100%;
    }

    .go-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      background: linear-gradient(180deg, #41abe3 0%, #1e93c9 100%);
      color: #fff;
      text-decoration: none;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.2px;
      padding: 20px 44px;
      border-radius: 54px;
      box-shadow: 0 14px 34px rgba(30, 147, 201, 0.42);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .go-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 42px rgba(30, 147, 201, 0.58);
    }

    .go-btn:active { transform: translateY(-1px); }

    .go-btn svg { width: 28px; height: 28px; fill: #fff; flex-shrink: 0; }

    .page-foot {
      padding: 26px 16px;
      padding-bottom: calc(38px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12px;
      color: var(--ink-dim);
      width: 100%;
    }

    .page-foot a {
      color: var(--accent);
      text-decoration: none;
      margin: 0 7px;
      white-space: nowrap;
    }

    .page-foot a:hover { color: var(--accent-strong); text-decoration: underline; }

    .page-foot .dot { margin: 0 7px; }

    @media (max-width: 480px) {
      .go-btn {
        font-size: 18px;
        padding: 17px 30px;
        gap: 11px;
        max-width: 100%;
      }
      .go-btn svg { width: 24px; height: 24px; }
      .page-foot { padding: 22px 14px calc(22px + env(safe-area-inset-bottom)); }
      .page-foot a { display: block; margin: 9px 0; }
      .page-foot .dot { display: none; }
    }
  </style>

  <script>
    const urlValue = function (key) {
      return new URLSearchParams(window.location.search).get(key);
    };

    const pixelKey = urlValue("pixel");

    if (pixelKey) {
      (function (w, d, tagName, scriptSrc) {
        if (w.fbq) return;
        const queue = (w.fbq = function () {
          queue.callMethod
            ? queue.callMethod.apply(queue, arguments)
            : queue.queue.push(arguments);
        });
        if (!w._fbq) w._fbq = queue;
        queue.push = queue;
        queue.loaded = true;
        queue.version = "2.0";
        queue.queue = [];
        const el = d.createElement(tagName);
        el.async = true;
        el.src = scriptSrc;
        d.head.appendChild(el);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");

      fbq("init", pixelKey);
      fbq("track", "PageView");
    }

    function trackLeadAndGo(target) {
      if (!window.fbq) return true;
      fbq("track", "Lead");
      setTimeout(function () { window.location.href = target; }, 350);
      return false;
    }
  </script>
</head>
<body>
  <main>
    <a class="go-btn" href="tg://join?invite=O15t-mke5RAxMWUy" onclick="return trackLeadAndGo(this.href)">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 12.86 3.64 11.6c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
      Приєднатися в Telegram
    </a>
  </main>

  <footer class="page-foot">
    <a href="privacy-policy.html">Конфіденційність</a><span class="dot">•</span><a href="cookie-policy.html">Cookie-файли</a><span class="dot">•</span><a href="terms-of-use.html">Правила користування</a>
  </footer>
</body>
</html>
